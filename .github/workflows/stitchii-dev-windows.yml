name: Stitchii Windows development build (no release)

# This workflow is intentionally NOT triggered by changes to stitchii/stutterfix.
# After explicit owner approval, create the stitchii/ci-test branch from the reviewed
# stutterfix commit. Its first push runs this isolated compile and uploads a test artifact.
on:
  push:
    branches:
      - stitchii/ci-test

permissions:
  contents: read

concurrency:
  group: stitchii-windows-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows MSVC source-build check
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools
        shell: pwsh
        run: glslangValidator --version

      - name: Restore compilation and dependency caches
        uses: actions/cache@v4
        with:
          path: |
            .sccache
            .cache/cpm
          key: stitchii-msvc2022-${{ runner.os }}-${{ hashFiles('cpmfile.json', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            stitchii-msvc2022-${{ runner.os }}-${{ hashFiles('cpmfile.json', 'CMakeLists.txt') }}-
            stitchii-msvc2022-${{ runner.os }}-

      - name: Install sccache compiler cache
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'stitchii-sccache'
          Invoke-WebRequest -OutFile $archive 'https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip'
          Expand-Archive -Path $archive -DestinationPath $folder
          $exe = Get-ChildItem -LiteralPath $folder -Recurse -Filter sccache.exe | Select-Object -First 1
          if (-not $exe) { throw 'sccache executable missing from downloaded archive' }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $exe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'sccache setup failed' }

      - name: Configure Stitchii
        shell: pwsh
        run: |
          cmake -S . -B build/release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DYUZU_TESTS=OFF `
            -DYUZU_CMD=ON `
            -DYUZU_ROOM=OFF `
            -DYUZU_ROOM_STANDALONE=OFF `
            -DYUZU_USE_BUNDLED_QT=OFF `
            -DYUZU_USE_BUNDLED_SDL3=ON `
            -DENABLE_UPDATE_CHECKER=OFF `
            -DLICHII_BUILD_TAG=stitchii-dev `
            -DLICHII_BUILD_PLATFORM=windows-x86_64 `
            -DUSE_DISCORD_PRESENCE=OFF `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }

      - name: Compile Windows emulator and CLI
        shell: pwsh
        run: |
          sccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "Windows compilation failed" }

      - name: Report compiler cache hit rate
        if: always()
        shell: pwsh
        run: |
          sccache --show-stats
          # Compiler statistics are diagnostic only; a cache miss is not a build failure.

      - name: Package runtime dependencies
        shell: pwsh
        run: |
          foreach ($exe in @('lichii.exe', 'eden-cli.exe')) {
            if (-not (Test-Path "build/release/bin/$exe")) {
              throw "Missing expected executable: $exe"
            }
          }
          windeployqt --release --no-translations build/release/bin/lichii.exe
          if ($LASTEXITCODE -ne 0) { throw "Qt deployment failed" }
          # Branding is restricted to the test package; do not touch source or build targets.
          Rename-Item build/release/bin/lichii.exe Stitchii.exe
          Copy-Item tools/stitchii-analyze-log.ps1 build/release/bin/stitchii-analyze-log.ps1

      - name: Upload private development artifact (no GitHub release)
        uses: actions/upload-artifact@v4
        with:
          name: Stitchii-dev-windows-x64-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 7

      - name: Upload CMake diagnostic files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Stitchii-windows-build-diagnostics-${{ github.sha }}
          path: |
            build/release/CMakeCache.txt
            build/release/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
